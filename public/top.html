<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>目前最高分</title>
<!-- 官網遊戲頁用 iframe 嵌進去的小框：顯示聖誕遊戲目前最高分，每分鐘更新一次 -->
<style>
  html,body{margin:0; height:100%; background:transparent; font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif; -webkit-user-select:none; user-select:none;}
  .box{box-sizing:border-box; height:100%; display:flex; align-items:center; justify-content:center; gap:14px; padding:0 18px; border:2px dashed #9C8466; border-radius:14px; background:#F5F3EF; color:#5A4632;}
  .box small{font-size:15px; font-weight:700; letter-spacing:2px; color:#9C8466;}
  .box b{font-size:34px; font-weight:900; letter-spacing:2px; color:#B32F2D; font-variant-numeric:tabular-nums;}
  .box span{font-size:13px; color:#757575;}
  @media (max-width:360px){ .box{gap:8px;} .box b{font-size:28px;} .box span{display:none;} }
</style>
</head>
<body>
<div class="box"><small>目前最高分</small><b class="n">—</b><span class="t">換你來挑戰</span></div>
<script>
(function(){
  var n=document.querySelector('.n'), t=document.querySelector('.t');
  function load(){
    fetch('/api/scores?game=xmas',{cache:'no-store'}).then(function(r){ return r.json(); }).then(function(d){
      if(!d||!d.ok) return;
      n.textContent=d.best?d.best:'—';
      t.textContent=d.best?'換你來挑戰':'還沒有人上榜，搶第一個';
    }).catch(function(){});
  }
  load(); setInterval(load,60000);
  document.addEventListener('contextmenu',function(e){ e.preventDefault(); });
})();
</script>
</body>
</html>
