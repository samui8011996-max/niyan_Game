<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>招財貓接財氣｜泥研製所</title>
<meta name="description" content="左右移動招財貓，接住金幣和鈔票，小心炸彈！">
<link rel="icon" href="favicon.png">
<style>
  :root{
    --bg:#EFEDE9;      /* 米白底 */
    --tea:#BCA17F;     /* 奶茶棕 */
    --brown:#8B603A;   /* 深咖（胖胖貓線條色） */
    --grey:#757575;    /* 灰 */
    --ink:#4A3F35;     /* 內文深色 */
    --paper:#FFFDF8;
    --red:#B3302E;     /* 招福貓的紅 */
  }
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink); font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; letter-spacing:1px; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;}
  button{font:inherit; letter-spacing:inherit;}
  #stage{position:fixed; inset:0;}
  #cv{display:block; width:100%; height:100%; touch-action:none; cursor:none;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(0);}50%{transform:translateY(-5px) rotate(-3deg);}}

  /* 上方資訊列 */
  .hud{position:absolute; top:0; left:0; right:0; display:flex; align-items:center; gap:8px; padding:10px 12px; pointer-events:none; font-weight:700;}
  .pill{background:rgba(255,253,248,.9); border:1.5px solid var(--tea); border-radius:999px; padding:3px 12px; font-size:14px; white-space:nowrap;}
  .pill b{color:var(--brown); font-size:17px;}
  .lives{color:var(--red); letter-spacing:3px;}
  .lives i{font-style:normal; opacity:.2;}
  .lives i.on{opacity:1;}
  .sp{flex:1;}
  .mute{pointer-events:auto; cursor:pointer; color:var(--grey); font-weight:400; font-size:12px;}
  .combo{position:absolute; top:50px; left:0; right:0; text-align:center; font-weight:700; font-size:15px; color:var(--red); opacity:0; transition:opacity .2s; pointer-events:none;}
  .combo.on{opacity:1;}

  /* 開始／結算畫面 */
  .ov{position:absolute; inset:0; display:none; align-items:center; justify-content:center; padding:16px; background:rgba(239,237,233,.85);}
  .ov.on{display:flex; animation:fade .25s ease;}
  .card{width:100%; max-width:360px; max-height:100%; overflow-y:auto; background:var(--paper); border-radius:24px; padding:24px 20px 20px; text-align:center; box-shadow:0 18px 40px rgba(139,96,58,.18);}
  .card .cat{display:block; width:88px; height:auto; margin:0 auto 4px; animation:bob 2.4s ease-in-out infinite;}
  .card h1{margin:4px 0 2px; font-size:24px; letter-spacing:3px;}
  .sub{margin:0 0 16px; font-size:14px; color:var(--grey);}
  .rules{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:0 0 18px;}
  .rules div{background:#fff; border:1px solid #E7E1D7; border-radius:14px; padding:8px 4px; font-size:12px; color:var(--grey);}
  .rules canvas{display:block; width:46px; height:46px; margin:0 auto 2px;}
  .rules b{display:block; font-size:15px; color:var(--brown);}
  .rules .bad b{color:var(--red);}
  .btn{display:inline-block; min-width:180px; padding:12px 32px; border:0; border-radius:999px; background:var(--brown); color:#fff; font-size:16px; letter-spacing:3px; cursor:pointer; transition:opacity .2s;}
  .btn:hover{opacity:.88;}
  .btn:disabled{opacity:.5; cursor:wait;}
  .how{margin:12px 0 0; font-size:12px; color:var(--grey);}
  .big{font-size:46px; font-weight:700; line-height:1.2; color:var(--brown); letter-spacing:2px;}
  .big small{font-size:18px; margin-right:4px;}
  .rank{display:inline-block; margin:4px 0 6px; padding:2px 14px; border-radius:999px; background:var(--red); color:#fff; font-size:13px; letter-spacing:2px;}
  .msg{margin:6px 0 4px; font-size:15px; line-height:1.7;}
  .best{margin:0 0 16px; font-size:13px; color:var(--grey);}
  .stat{display:flex; justify-content:center; gap:14px; margin:0 0 14px; font-size:13px; color:var(--grey);}
  .stat b{color:var(--ink);}
  .btn.line{background:transparent; color:var(--brown); border:1.5px solid var(--brown); padding:9px 28px; font-size:14px;}

  /* 領券 */
  .claim{margin:0 0 14px; padding:14px 14px 12px; border:1.5px dashed var(--tea); border-radius:18px; background:#fff;}
  .claim[hidden]{display:none;}
  .claim-t{margin:0 0 10px; font-size:14px;}
  .claim-t b{color:var(--red); font-size:17px;}
  .claim input[type=email]{width:100%; padding:11px 14px; border-radius:12px; border:1.5px solid #E2DBCF; background:#fff; font:inherit; font-size:16px; color:var(--ink); outline:none; -webkit-user-select:text; user-select:text;}
  .claim input[type=email]:focus{border-color:var(--tea);}
  .agree{display:flex; gap:6px; align-items:flex-start; margin:8px 0 0; text-align:left; font-size:12px; line-height:1.6; color:var(--grey); cursor:pointer;}
  .agree input{flex:none; width:15px; height:15px; margin:2px 0 0; accent-color:var(--brown);}
  .err{min-height:18px; margin:4px 0; font-size:12px; color:var(--red);}
  .claim .btn{width:100%; min-width:0;}
  .hp{position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden;}
  .code{display:flex; align-items:center; justify-content:center; gap:10px; margin:4px 0 6px;}
  .code b{font-size:26px; letter-spacing:4px; color:var(--brown); font-family:ui-monospace,Consolas,monospace;}
  .copy{border:0; background:var(--tea); color:#fff; border-radius:999px; padding:5px 14px; font-size:13px; cursor:pointer;}
  .got-how{margin:0 0 10px; font-size:12px; color:var(--grey);}
  .shop{display:inline-block; font-size:13px; color:var(--brown); text-underline-offset:4px;}

  /* 外嵌框比較矮時，結算畫面收緊一點 */
  @media (max-height:640px){
    .ov-end .cat{display:none;}
    .card{padding:18px 16px 16px;}
    .big{font-size:38px;}
    .stat{margin-bottom:10px;}
    .best{margin-bottom:10px;}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div class="hud">
    <span class="pill">財氣 <b class="h-score">0</b></span>
    <span class="pill h-time">45 秒</span>
    <span class="sp"></span>
    <span class="pill lives"><i class="on">♥</i><i class="on">♥</i><i class="on">♥</i></span>
    <button type="button" class="pill mute"></button>
  </div>
  <div class="combo"></div>

  <div class="ov ov-start on">
    <div class="card">
      <img class="cat" src="assets/cat.svg" alt="">
      <h1>招財貓接財氣</h1>
      <p class="sub">左右移動胖胖貓，45 秒內招進最多財氣<br>玩完留下 Email，送官網 95 折優惠碼</p>
      <div class="rules">
        <div><canvas data-icon="coin" width="92" height="92"></canvas><b>+10</b>金幣</div>
        <div><canvas data-icon="bill" width="92" height="92"></canvas><b>+100</b>百元鈔</div>
        <div class="bad"><canvas data-icon="bomb" width="92" height="92"></canvas><b>小心</b>炸彈扣命</div>
      </div>
      <button type="button" class="btn js-start" disabled>載入中…</button>
      <p class="how">手機：手指左右滑　電腦：滑鼠或方向鍵<br>連續接住會有連擊加倍</p>
    </div>
  </div>

  <div class="ov ov-end">
    <div class="card">
      <img class="cat" src="assets/cat.svg" alt="">
      <div class="rank e-rank"></div>
      <div class="big"><small>財氣</small><span class="e-score">0</span></div>
      <p class="msg e-msg"></p>
      <div class="stat"><span>金幣 <b class="e-coin">0</b></span><span>百元鈔 <b class="e-bill">0</b></span><span>最高連擊 <b class="e-combo">0</b></span></div>
      <p class="best e-best"></p>

      <form class="claim c-form" novalidate>
        <p class="claim-t">留下 Email，領官網 <b>95 折</b>優惠碼</p>
        <input type="email" name="email" placeholder="你的 Email" autocomplete="email" inputmode="email" required>
        <div class="hp" aria-hidden="true"><label>網站 <input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
        <label class="agree"><input type="checkbox" name="consent">我同意泥研製所寄送優惠與新品消息到這個 Email，可隨時取消訂閱。</label>
        <p class="err" role="alert"></p>
        <button type="submit" class="btn">領取優惠碼</button>
      </form>
      <div class="claim c-got" hidden>
        <p class="claim-t c-title">你的 95 折優惠碼</p>
        <div class="code"><b class="c-code"></b><button type="button" class="copy">複製</button></div>
        <p class="got-how c-how"></p>
        <a class="shop" target="_top">去官網選購</a>
      </div>

      <button type="button" class="btn line js-start">再玩一次</button>
    </div>
  </div>
</div>

<script>
(function(){
  /* ===== 可調整的設定 ===== */
  var DURATION=45;                 /* 一局秒數 */
  var LIVES=3;                     /* 幾條命 */
  var PTS={coin:10, bill:100};     /* 分數 */
  /* 結算評語：分數門檻由低到高 */
  var RANKS=[
    [0,   '小財迷',   '財氣小小的，再招一次會更旺！'],
    [400, '招財學徒', '財氣不錯喔，今天適合犒賞自己。'],
    [1000,'招財達人', '財氣滿滿，胖胖貓都替你開心！'],
    [2000,'招財大師', '財神爺都要來拜訪你了！']
  ];
  var SHOP='https://niyancement.shoplineapp.com/';
  var HOW='到官網結帳時，在「優惠代碼」欄位輸入就能享 95 折。';

  var $=function(s){ return document.querySelector(s); };
  var $$=function(s){ return [].slice.call(document.querySelectorAll(s)); };
  var store={
    get:function(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
    set:function(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
  };
  function clamp(v,a,b){ return v<a?a:v>b?b:v; }
  function lerp(a,b,t){ return a+(b-a)*t; }

  var cv=$('#cv'), ctx=cv.getContext('2d');
  var W=0, H=0, catW=0, catH=0, ground=0, size=0;

  /* ===== 素材 ===== */
  var IMG={cat:new Image(), bill:new Image()}, loaded=0;
  function onLoad(){ if(++loaded<2) return; $$('.ov-start .js-start')[0].disabled=false; $$('.ov-start .js-start')[0].textContent='開始'; drawIcons(); }
  IMG.cat.onload=onLoad; IMG.bill.onload=onLoad;
  IMG.cat.src='assets/cat.svg'; IMG.bill.src='assets/bill.svg';

  /* ===== 狀態 ===== */
  var cat={x:0, y:0, vx:0, squash:0, hurt:0};
  var target=0, keys={l:false, r:false};
  var items=[], parts=[], texts=[];
  var state='menu', score=0, lives=LIVES, elapsed=0, spawnT=0, combo=0, maxCombo=0, got={coin:0,bill:0}, shake=0, countdown=0;
  var best=store.get('niyan_catch_best')||0;

  function resize(){
    var dpr=Math.min(window.devicePixelRatio||1,2);
    W=cv.clientWidth; H=cv.clientHeight;
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    catW=clamp(Math.min(W*0.28,H*0.2),70,150); catH=catW*456/404;
    size=catW;
    ground=H-Math.max(16,H*0.035);
    cat.y=ground-catH;
    if(!cat.x) cat.x=target=W/2;
    cat.x=clamp(cat.x,catW/2,W-catW/2); target=clamp(target,catW/2,W-catW/2);
  }
  window.addEventListener('resize',resize);
  resize();

  /* ===== 畫物件 ===== */
  function star(c,x,y,r,n){
    c.beginPath();
    for(var i=0;i<n*2;i++){ var a=i*Math.PI/n, rr=i%2?r*0.45:r; c.lineTo(x+Math.cos(a)*rr, y+Math.sin(a)*rr); }
    c.closePath(); c.fill();
  }
  function drawCoin(c,x,y,r,t){
    c.save(); c.translate(x,y); c.scale(Math.max(0.18,Math.abs(Math.cos(t*3))),1);
    var g=c.createRadialGradient(-r*0.3,-r*0.3,r*0.1,0,0,r);
    g.addColorStop(0,'#F7DE98'); g.addColorStop(1,'#C9973A');
    c.fillStyle=g; c.beginPath(); c.arc(0,0,r,0,Math.PI*2); c.fill();
    c.lineWidth=r*0.12; c.strokeStyle='#A8782C'; c.stroke();
    c.beginPath(); c.arc(0,0,r*0.7,0,Math.PI*2); c.lineWidth=r*0.06; c.strokeStyle='rgba(139,96,58,.45)'; c.stroke();
    var h=r*0.24; c.fillStyle='#8B603A'; c.fillRect(-h,-h,h*2,h*2);
    c.restore();
  }
  function drawBill(c,x,y,w,t){
    var h=w*207/419;
    c.save(); c.translate(x,y); c.rotate(Math.sin(t*2.2)*0.25);
    c.drawImage(IMG.bill,-w/2,-h/2,w,h);
    c.restore();
  }
  function drawBomb(c,x,y,r,t){
    c.save(); c.translate(x,y); c.rotate(Math.sin(t*3)*0.15);
    c.fillStyle='#3A3330'; c.beginPath(); c.arc(0,r*0.1,r,0,Math.PI*2); c.fill();
    c.fillStyle='rgba(255,255,255,.22)'; c.beginPath(); c.arc(-r*0.35,-r*0.2,r*0.24,0,Math.PI*2); c.fill();
    c.fillStyle='#5A4F49'; c.fillRect(-r*0.28,-r*1.05,r*0.56,r*0.3);
    c.strokeStyle='#8B603A'; c.lineWidth=r*0.12; c.lineCap='round';
    c.beginPath(); c.moveTo(0,-r*1.05); c.quadraticCurveTo(r*0.3,-r*1.5,r*0.6,-r*1.35); c.stroke();
    var s=r*(0.26+0.08*Math.sin(t*22));
    c.fillStyle='#F0A030'; star(c,r*0.6,-r*1.35,s,5);
    c.fillStyle='#FFE08A'; star(c,r*0.6,-r*1.35,s*0.5,5);
    c.restore();
  }
  function drawIcons(){
    $$('canvas[data-icon]').forEach(function(el){
      var c=el.getContext('2d'), k=el.dataset.icon, s=el.width;
      c.clearRect(0,0,s,s);
      if(k==='coin') drawCoin(c,s/2,s/2,s*0.36,0);
      if(k==='bill') drawBill(c,s/2,s/2,s*0.9,0);
      if(k==='bomb') drawBomb(c,s/2,s*0.56,s*0.3,0.3);
    });
  }

  /* ===== 遊戲流程 ===== */
  function halfOf(k){ return k==='bill'?size*0.31:k==='bomb'?size*0.2:size*0.17; }
  function spawn(){
    var p=Math.min(elapsed/DURATION,1), r=Math.random();
    var bombP=0.16+p*0.18, billP=0.2;
    var k=r<bombP?'bomb':r<bombP+billP?'bill':'coin', half=halfOf(k);
    var x=half+Math.random()*(W-half*2);
    items.push({k:k, x:x, x0:x, y:-half*2, half:half, t:Math.random()*6,
      vy:(k==='bill'?0.7:1)*H*0.34*(1+p*0.9)*(0.85+Math.random()*0.3)});
  }

  function start(){
    audio();
    score=0; lives=LIVES; elapsed=0; spawnT=0.2; combo=0; maxCombo=0; got={coin:0,bill:0};
    items=[]; parts=[]; texts=[];
    state='count'; countdown=2.1;
    $$('.ov').forEach(function(o){ o.classList.remove('on'); });
    hud();
  }

  function end(){
    if(state==='over') return;
    state='over';
    var first=score>best;
    if(first){ best=score; store.set('niyan_catch_best',best); }
    var rk=RANKS[0]; RANKS.forEach(function(x){ if(score>=x[0]) rk=x; });
    $('.e-score').textContent=score;
    $('.e-rank').textContent=rk[1];
    $('.e-msg').textContent=lives<=0?'被炸彈嚇到了！'+rk[2]:rk[2];
    $('.e-coin').textContent=got.coin; $('.e-bill').textContent=got.bill; $('.e-combo').textContent=maxCombo;
    $('.e-best').textContent=first&&score>0?'刷新你的最高紀錄！':'你的最高紀錄：'+best;
    renderClaim();
    sfx('end');
    /* 通知外層頁面（之後接優惠碼可以用） */
    try{ window.parent.postMessage({type:'niyan-catch:end', score:score},'*'); }catch(e){}
    setTimeout(function(){ $('.ov-end').classList.add('on'); },700);
  }

  function catchItem(it){
    if(it.k==='bomb'){
      lives--; combo=0; shake=0.35; cat.hurt=0.7;
      burst(it.x,it.y,['#3A3330','#F0A030','#757575'],18);
      pop(it.x,it.y,'-1','#B3302E');
      sfx('bomb');
      if(lives<=0) end();
      return;
    }
    combo++; maxCombo=Math.max(maxCombo,combo); got[it.k]++;
    var mult=combo>=15?3:combo>=5?2:1, pts=PTS[it.k]*mult;
    score+=pts; cat.squash=1;
    burst(it.x,it.y,['#F7DE98','#C9973A','#BCA17F'],it.k==='bill'?14:8);
    pop(it.x,it.y-10,'+'+pts,'#8B603A');
    sfx(it.k);
  }

  function burst(x,y,cols,n){
    for(var i=0;i<n;i++){
      var a=Math.random()*Math.PI*2, v=size*(0.8+Math.random()*1.6);
      parts.push({x:x, y:y, vx:Math.cos(a)*v, vy:Math.sin(a)*v-size, life:0.6+Math.random()*0.3, c:cols[i%cols.length], s:size*(0.03+Math.random()*0.04)});
    }
  }
  function pop(x,y,txt,col){ texts.push({x:x, y:y, txt:txt, c:col, life:0.9}); }

  function moveCat(dt){
    if(keys.l) target-=W*1.2*dt;
    if(keys.r) target+=W*1.2*dt;
    target=clamp(target,catW/2,W-catW/2);
    var nx=cat.x+(target-cat.x)*Math.min(1,dt*14);
    cat.vx=(nx-cat.x)/Math.max(dt,1e-4); cat.x=nx;
    cat.squash=Math.max(0,cat.squash-dt*5);
    cat.hurt=Math.max(0,cat.hurt-dt);
    shake=Math.max(0,shake-dt);
  }

  function update(dt){
    moveCat(dt);
    parts.forEach(function(p){ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=size*5*dt; });
    parts=parts.filter(function(p){ return p.life>0; });
    texts.forEach(function(t){ t.life-=dt; t.y-=size*0.6*dt; });
    texts=texts.filter(function(t){ return t.life>0; });

    if(state==='count'){
      var n=Math.ceil(countdown/0.7);
      countdown-=dt;
      if(Math.ceil(countdown/0.7)!==n) sfx(countdown>0?'tick':'go');
      if(countdown<=0) state='play';
      return;
    }
    if(state!=='play') return;

    elapsed+=dt;
    var p=Math.min(elapsed/DURATION,1);
    spawnT-=dt;
    if(spawnT<=0){ spawn(); spawnT=lerp(0.72,0.34,p)*(0.8+Math.random()*0.4); }

    var top=cat.y, depth=catH*0.38, reach=catW*0.42;
    for(var i=items.length-1;i>=0;i--){
      var it=items[i];
      it.t+=dt; it.y+=it.vy*dt;
      if(it.k==='bill') it.x=clamp(it.x0+Math.sin(it.t*2.2)*size*0.22,it.half,W-it.half);
      if(it.y+it.half>=top && it.y-it.half<=top+depth && Math.abs(it.x-cat.x)<=reach+it.half*0.5){
        items.splice(i,1); catchItem(it);
        if(state!=='play') break;
        continue;
      }
      if(it.y-it.half>H){ if(it.k!=='bomb') combo=0; items.splice(i,1); }
    }
    if(state==='play' && elapsed>=DURATION) end();
    hud();
  }

  function draw(){
    ctx.save();
    ctx.clearRect(0,0,W,H);
    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#F7F4EF'); g.addColorStop(1,'#EFEDE9');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    if(shake>0){ var m=shake*16; ctx.translate((Math.random()-0.5)*m,(Math.random()-0.5)*m); }
    ctx.fillStyle='#E4DCCF'; ctx.fillRect(-20,ground,W+40,H-ground+20);

    items.forEach(function(it){
      if(it.k==='coin') drawCoin(ctx,it.x,it.y,it.half,it.t);
      else if(it.k==='bill') drawBill(ctx,it.x,it.y,it.half*2,it.t);
      else drawBomb(ctx,it.x,it.y,it.half,it.t);
    });

    /* 胖胖貓：以腳底為中心，移動時會歪頭，接到東西會彈一下 */
    ctx.fillStyle='rgba(139,96,58,.15)';
    ctx.beginPath(); ctx.ellipse(cat.x,ground,catW*0.42,catW*0.07,0,0,Math.PI*2); ctx.fill();
    ctx.save();
    ctx.translate(cat.x,ground);
    ctx.rotate(clamp(cat.vx*0.00025,-0.18,0.18));
    var sq=Math.sin(cat.squash*Math.PI)*0.08; ctx.scale(1+sq,1-sq);
    if(cat.hurt>0 && Math.floor(cat.hurt*12)%2===0) ctx.globalAlpha=0.4;
    if(IMG.cat.complete) ctx.drawImage(IMG.cat,-catW/2,-catH,catW,catH);
    ctx.restore();

    parts.forEach(function(p){ ctx.globalAlpha=Math.min(1,p.life*2); ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,p.s,0,Math.PI*2); ctx.fill(); });
    ctx.globalAlpha=1;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    texts.forEach(function(t){
      ctx.globalAlpha=Math.min(1,t.life*2);
      ctx.font='700 '+Math.round(size*0.22)+'px "PingFang TC","Microsoft JhengHei",sans-serif';
      ctx.lineWidth=4; ctx.strokeStyle='#FFFDF8'; ctx.strokeText(t.txt,t.x,t.y);
      ctx.fillStyle=t.c; ctx.fillText(t.txt,t.x,t.y);
    });
    ctx.globalAlpha=1;

    if(state==='count'){
      var n=Math.ceil(countdown/0.7), f=countdown/0.7-Math.floor(countdown/0.7);
      ctx.font='700 '+Math.round(size*(0.7+f*0.3))+'px "PingFang TC","Microsoft JhengHei",sans-serif';
      ctx.lineWidth=6; ctx.strokeStyle='#FFFDF8'; ctx.strokeText(n,W/2,H*0.42);
      ctx.fillStyle='#8B603A'; ctx.fillText(n,W/2,H*0.42);
    }
    ctx.restore();
  }

  var hScore=$('.h-score'), hTime=$('.h-time'), hLives=$$('.lives i'), hCombo=$('.combo');
  function hud(){
    hScore.textContent=score;
    hTime.textContent=Math.ceil(Math.max(0,DURATION-elapsed))+' 秒';
    hLives.forEach(function(h,i){ h.classList.toggle('on',i<lives); });
    var mult=combo>=15?3:combo>=5?2:1;
    hCombo.classList.toggle('on',combo>=5&&state==='play');
    if(combo>=5) hCombo.textContent=combo+' 連擊　分數 x'+mult;
  }

  var last=0;
  function loop(now){
    var dt=Math.min(0.05,(now-last)/1000||0); last=now;
    update(dt); draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* ===== 操作 ===== */
  function pointerX(e){ return e.clientX-cv.getBoundingClientRect().left; }
  cv.addEventListener('pointerdown',function(e){ target=pointerX(e); try{ cv.setPointerCapture(e.pointerId); }catch(x){} });
  cv.addEventListener('pointermove',function(e){ target=pointerX(e); });
  window.addEventListener('keydown',function(e){
    if(/INPUT|TEXTAREA|BUTTON/.test(e.target.tagName)) return;   /* 正在填 email 時不搶按鍵 */
    if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){ keys.l=true; e.preventDefault(); }
    if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){ keys.r=true; e.preventDefault(); }
    if((e.key===' '||e.key==='Enter') && (state==='menu'&&loaded>=2 || state==='over'&&$('.ov-end.on'))){ e.preventDefault(); start(); }
  });
  window.addEventListener('keyup',function(e){
    if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') keys.l=false;
    if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') keys.r=false;
  });
  $$('.js-start').forEach(function(b){ b.onclick=start; });

  /* ===== 領券：email 存到 D1（/api/claim），回傳優惠碼 ===== */
  var SRC=(new URLSearchParams(location.search).get('src')||'').slice(0,60);
  var claimed=store.get('niyan_claim');
  var form=$('.c-form'), got=$('.c-got'), err=$('.c-form .err'), submit=$('.c-form .btn');
  $('.shop').href=SHOP;
  $('.c-how').textContent=HOW;
  function renderClaim(again){
    form.hidden=!!claimed; got.hidden=!claimed;
    if(!claimed) return;
    $('.c-title').textContent=again?'這個 Email 已經領過囉，優惠碼在這裡':'你的 95 折優惠碼';
    $('.c-code').textContent=claimed.code;
    $('.copy').textContent='複製';
  }
  form.addEventListener('submit',function(e){
    e.preventDefault();
    var email=form.email.value.trim();
    err.textContent='';
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ err.textContent='請輸入正確的 Email'; form.email.focus(); return; }
    if(!form.consent.checked){ err.textContent='請勾選同意，才能寄送優惠給你'; return; }
    submit.disabled=true; submit.textContent='處理中…';
    fetch('/api/claim',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:email, consent:true, game:'catch', score:best, src:SRC, website:form.website.value})
    }).then(function(r){ return r.json().then(function(d){ return {ok:r.ok, d:d}; }); })
      .then(function(res){
        if(!res.ok||!res.d.ok) throw new Error(res.d.error||'');
        claimed={code:res.d.code}; store.set('niyan_claim',claimed);
        renderClaim(!res.d.isNew);
      })
      .catch(function(x){ err.textContent=x.message||'網路好像不太穩，請再試一次'; })
      .then(function(){ submit.disabled=false; submit.textContent='領取優惠碼'; });
  });
  $('.copy').onclick=function(){
    var b=this, code=$('.c-code').textContent;
    function done(){ b.textContent='已複製'; }
    function fallback(){
      var t=document.createElement('textarea'); t.value=code; document.body.appendChild(t); t.select();
      try{ document.execCommand('copy'); done(); }catch(e){}
      document.body.removeChild(t);
    }
    if(navigator.clipboard) navigator.clipboard.writeText(code).then(done,fallback); else fallback();
  };

  /* ===== 音效（WebAudio 合成，不用另外載檔） ===== */
  var AC=null, muted=store.get('niyan_catch_mute')===true, muteBtn=$('.mute');
  function setMuteLabel(){ muteBtn.textContent=muted?'音效 關':'音效 開'; }
  setMuteLabel();
  muteBtn.onclick=function(){ muted=!muted; store.set('niyan_catch_mute',muted); setMuteLabel(); audio(); };
  function audio(){
    if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(AC&&AC.state==='suspended') AC.resume();
  }
  function tone(f,d,type,vol,to,delay){
    if(muted||!AC) return;
    var t=AC.currentTime+(delay||0), o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
    if(to) o.frequency.exponentialRampToValueAtTime(to,t+d);
    g.gain.setValueAtTime(vol||0.1,t); g.gain.exponentialRampToValueAtTime(0.001,t+d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+0.02);
  }
  function sfx(k){
    if(k==='coin'){ tone(1319,0.07,'square',0.05); tone(1976,0.12,'square',0.05,0,0.06); }
    else if(k==='bill'){ tone(784,0.1,'triangle',0.12); tone(1175,0.1,'triangle',0.12,0,0.08); tone(1568,0.18,'triangle',0.12,0,0.16); }
    else if(k==='bomb'){ tone(180,0.4,'sawtooth',0.16,45); }
    else if(k==='tick'){ tone(660,0.08,'sine',0.1); }
    else if(k==='go'){ tone(990,0.18,'sine',0.12); }
    else if(k==='end'){ [523,659,784,1047].forEach(function(f,i){ tone(f,0.22,'triangle',0.1,0,i*0.11); }); }
  }
})();
</script>
</body>
</html>
