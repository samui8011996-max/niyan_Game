<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>聖誕胖胖貓送禮｜泥研製所</title>
<meta name="description" content="聖誕胖胖貓坐雪橇送禮物，看清楚煙囪要紅色還是綠色，60 秒內送出最多份！">
<link rel="icon" href="favicon.png">
<style>
  :root{
    --bg:#EFEDE9;      /* 米白 */
    --tea:#BCA17F;     /* 奶茶棕 */
    --brown:#8B603A;   /* 深咖 */
    --grey:#757575;
    --ink:#4A3F35;
    --paper:#FFFDF8;
    --red:#B3302E;     /* 紅禮物 */
    --green:#4F7A5A;   /* 綠禮物 */
    --gold:#C9A15B;
    --night:#34414B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%; overflow:hidden; background:var(--night); color:var(--ink); font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; letter-spacing:1px; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;}
  button{font:inherit; letter-spacing:inherit;}
  #stage{position:fixed; inset:0;}
  #cv{display:block; width:100%; height:100%; touch-action:none;}
  /* 水彩紙紋：灰階水彩圖用柔光疊在最上層，整個畫面變水彩感；不擋點擊 */
  .tune{position:absolute; top:52px; left:12px; z-index:20; display:flex; align-items:center; gap:10px; padding:8px 14px; border-radius:999px; background:#FFFDF8; color:#4A3F30; font-size:14px; font-weight:700; box-shadow:0 6px 16px rgba(0,0,0,.25);}
  .tune[hidden]{display:none;}
  .tune input{width:180px; accent-color:#B3302E;}
  .tune b{min-width:36px; font-family:ui-monospace,Consolas,monospace;}
  .paper{position:absolute; inset:0; z-index:10; pointer-events:none; background:url(assets/watercolor.jpg) center/cover; mix-blend-mode:soft-light; opacity:.45;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(0);}50%{transform:translateY(-5px) rotate(-3deg);}}

  /* 上方資訊列 */
  .hud{position:absolute; top:0; left:0; right:0; display:flex; align-items:center; gap:8px; padding:10px 12px; pointer-events:none; font-weight:700;}
  .pill{background:rgba(255,253,248,.92); border:1.5px solid var(--gold); border-radius:999px; padding:3px 12px; font-size:14px; white-space:nowrap;}
  .pill b{color:var(--red); font-size:17px;}
  .sp{flex:1;}
  .mute{pointer-events:auto; cursor:pointer; color:var(--grey); font-weight:400; font-size:12px;}
  .combo{position:absolute; top:50px; left:0; right:0; text-align:center; font-weight:700; font-size:15px; color:#F3E4BF; text-shadow:0 1px 3px rgba(0,0,0,.4); opacity:0; transition:opacity .2s; pointer-events:none;}
  .combo.on{opacity:1;}

  /* 丟禮物按鈕 */
  .pad{position:absolute; left:0; right:0; bottom:0; display:flex; gap:10px; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); pointer-events:none;}
  .pad button{pointer-events:auto; flex:1; display:flex; align-items:center; justify-content:center; gap:8px; padding:11px 8px; border:0; border-radius:16px; color:#fff; font-size:15px; font-weight:700; letter-spacing:2px; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.25); transition:transform .06s;}
  .pad button:active,.pad button.hit{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.25);}
  .pad .g{background:var(--green);}
  .pad .r{background:var(--red);}
  .pad small{font-weight:400; font-size:11px; opacity:.8;}
  .pad canvas{width:26px; height:26px;}

  /* 開始／結算畫面 */
  .ov{position:absolute; inset:0; z-index:5; display:none; align-items:center; justify-content:center; padding:16px; background:rgba(40,48,56,.6);}
  .ov.on{display:flex; animation:fade .25s ease;}
  .card{width:100%; max-width:360px; max-height:100%; overflow-y:auto; scrollbar-width:thin; scrollbar-color:#D9D3CA transparent; background:var(--paper); border-radius:24px; padding:22px 20px 20px; text-align:center; box-shadow:0 18px 40px rgba(0,0,0,.3);}
  .card .icon{display:block; width:110px; height:100px; margin:0 auto 2px; animation:bob 2.4s ease-in-out infinite;}
  .card h1{margin:4px 0 2px; font-size:23px; letter-spacing:3px;}
  .sub{margin:0 0 14px; font-size:14px; line-height:1.7; color:var(--grey);}
  .sub b{color:var(--red);}
  .rules{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:0 0 16px;}
  .rules div{background:#fff; border:1px solid #E7E1D7; border-radius:14px; padding:8px 4px; font-size:12px; line-height:1.5; color:var(--grey);}
  .rules canvas{display:block; width:46px; height:46px; margin:0 auto 2px;}
  .rules b{display:block; font-size:14px; color:var(--ink);}
  .btn{display:inline-block; min-width:180px; padding:12px 32px; border:0; border-radius:999px; background:var(--red); color:#fff; font-size:16px; letter-spacing:3px; cursor:pointer; transition:opacity .2s;}
  .btn:hover{opacity:.88;}
  .btn:disabled{opacity:.5; cursor:wait;}
  .btn.line{background:transparent; color:var(--brown); border:1.5px solid var(--brown); padding:9px 28px; font-size:14px;}
  .how{margin:12px 0 0; font-size:12px; line-height:1.7; color:var(--grey);}
  .big{font-size:44px; font-weight:700; line-height:1.2; color:var(--red); letter-spacing:2px;}
  .big small{font-size:17px; margin-right:4px; color:var(--ink);}
  .rank{display:inline-block; margin:2px 0 6px; padding:2px 14px; border-radius:999px; background:var(--green); color:#fff; font-size:13px; letter-spacing:2px;}
  .msg{margin:6px 0 4px; font-size:15px; line-height:1.7;}
  .best{margin:0 0 14px; font-size:13px; color:var(--grey);}
  .best b{color:var(--red);}

  /* 目前最高分＋你的最高紀錄（完整排行榜只在出貨幫手看） */
  .rec{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:0 0 10px;}
  .rec div{background:#F6F1E8; border-radius:14px; padding:8px 6px;}
  .rec small{display:block; font-size:12px; color:var(--grey);}
  .rec b{display:block; font-size:22px; line-height:1.3; color:var(--red); letter-spacing:1px;}
  .rec-note{margin:0 0 12px; font-size:12px; font-weight:700; color:var(--brown);}
  .rec-note:empty{display:none;}
  .go2{display:flex; gap:8px;}
  .go2 .btn{flex:1; min-width:0; padding:10px 8px; font-size:14px; letter-spacing:1px; text-decoration:none; text-align:center;}
  .stat{display:flex; justify-content:center; gap:14px; margin:0 0 12px; font-size:13px; color:var(--grey);}
  .stat b{color:var(--ink);}

  /* 領券 */
  .claim{margin:0 0 14px; padding:14px 14px 12px; border:1.5px dashed var(--tea); border-radius:18px; background:#fff;}
  .claim[hidden]{display:none;}
  .claim-t{margin:0 0 10px; font-size:14px;}
  .claim-t b{color:var(--red); font-size:17px;}
  .claim input[type=email]{width:100%; padding:11px 14px; border-radius:12px; border:1.5px solid #E2DBCF; background:#fff; font:inherit; font-size:16px; color:var(--ink); outline:none; -webkit-user-select:text; user-select:text;}
  .claim input[type=email]:focus{border-color:var(--tea);}
  .agree{display:flex; gap:6px; align-items:flex-start; margin:8px 0 0; text-align:left; font-size:12px; line-height:1.6; color:var(--grey); cursor:pointer;}
  .agree input{flex:none; width:15px; height:15px; margin:2px 0 0; accent-color:var(--brown);}
  .err{min-height:18px; margin:4px 0; font-size:12px; color:var(--red);}
  .claim .btn{width:100%; min-width:0;}
  .hp{position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden;}
  .code{display:flex; align-items:center; justify-content:center; gap:10px; margin:4px 0 6px;}
  .code b{font-size:26px; letter-spacing:4px; color:var(--brown); font-family:ui-monospace,Consolas,monospace;}
  .copy{border:0; background:var(--tea); color:#fff; border-radius:999px; padding:5px 14px; font-size:13px; cursor:pointer;}
  .got-how{margin:0 0 10px; font-size:12px; color:var(--grey);}
  .shop{display:inline-block; font-size:13px; color:var(--brown); text-underline-offset:4px;}
  .note{display:block; margin:4px 0 8px; font-size:12px; font-weight:700; color:var(--red);}
  .note a{color:var(--red); text-underline-offset:3px;}

  /* 電腦寬畫面：卡片改左右兩欄、按鈕置中；手機維持直式 */
  @media (min-width:720px) and (min-aspect-ratio:5/4){
    .ov-end .card{max-width:760px; display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:start;}
    .ov-start .card{max-width:420px;}
    .pad{justify-content:center;}
    .pad button{flex:0 1 260px;}
  }
  @media (max-height:640px){
    .card .icon{display:none;}
    .card{padding:18px 16px 16px;}
    .big{font-size:36px;}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div class="paper"></div>
  <!-- 調整用：網址加 ?tune 才會出現，客人看不到 -->
  <label class="tune" hidden>水彩透明度 <input type="range" min="0" max="1" step="0.05" value="0.45"> <b>0.45</b></label>

  <div class="hud">
    <span class="pill">分數 <b class="h-score">0</b></span>
    <span class="pill h-time">60 秒</span>
    <span class="sp"></span>
    <span class="pill h-done">送達 0</span>
    <button type="button" class="pill mute"></button>
  </div>
  <div class="combo"></div>

  <div class="pad">
    <button type="button" class="g" data-c="g"><canvas data-icon="g" width="52" height="52"></canvas>綠禮物<small>左鍵</small></button>
    <button type="button" class="r" data-c="r"><canvas data-icon="r" width="52" height="52"></canvas>紅禮物<small>右鍵</small></button>
  </div>

  <div class="ov ov-start on">
    <div class="card">
      <div class="col">
      <canvas class="icon" data-icon="sleigh" width="220" height="200"></canvas>
      <h1>聖誕胖胖貓送禮</h1>
      <p class="sub">60 秒內把禮物丟進煙囪<br>煙囪要<b>什麼顏色</b>，就丟什麼顏色</p>
      <div class="rules">
        <div><canvas data-icon="bubble" width="92" height="92"></canvas><b>看煙囪</b>上面的顏色</div>
        <div><canvas data-icon="g" width="92" height="92"></canvas><b>左鍵</b>丟綠禮物</div>
        <div><canvas data-icon="r" width="92" height="92"></canvas><b>右鍵</b>丟紅禮物</div>
      </div>
      <div class="rec"><div><small>目前最高分</small><b class="r-top">—</b></div><div><small>你的最高紀錄</small><b class="r-mine">—</b></div></div>
      <p class="rec-note n-start"></p>
      <button type="button" class="btn js-start" disabled>載入中…</button>
      <p class="how">手機：點下方綠色、紅色按鈕<br>送對 +100，連續送對分數加倍，送錯扣 50</p>
      </div>
    </div>
  </div>

  <div class="ov ov-end">
    <div class="card">
      <div class="col">
      <canvas class="icon" data-icon="sleigh" width="220" height="200"></canvas>
      <div class="rank e-rank"></div>
      <div class="big"><small>分數</small><span class="e-score">0</span></div>
      <p class="msg e-msg"></p>
      <div class="stat"><span>送達 <b class="e-ok">0</b></span><span>送錯 <b class="e-ng">0</b></span><span>最高連擊 <b class="e-combo">0</b></span></div>
      <div class="rec"><div><small>目前最高分</small><b class="r-top">—</b></div><div><small>你的最高紀錄</small><b class="r-mine">—</b></div></div>
      <p class="rec-note n-end"></p>

      </div>
      <div class="col">
      <form class="claim c-form" novalidate>
        <p class="claim-t">留下 Email 登錄分數<br>再送官網 <b>95 折</b>優惠碼<small class="note">優惠碼限官網會員使用，還不是會員？<a class="join" target="_top">加入會員</a></small></p>
        <input type="email" name="email" placeholder="你的 Email" autocomplete="email" inputmode="email" required>
        <div class="hp" aria-hidden="true"><label>網站 <input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
        <label class="agree"><input type="checkbox" name="consent">我同意泥研製所寄送優惠與新品消息到這個 Email，可隨時取消訂閱。</label>
        <p class="err" role="alert"></p>
        <button type="submit" class="btn">登錄分數並領取優惠碼</button>
      </form>
      <div class="claim c-got" hidden>
        <p class="claim-t c-title">你的 95 折優惠碼</p>
        <div class="code"><b class="c-code"></b><button type="button" class="copy">複製</button></div>
        <p class="got-how c-how"></p>
        <div class="go2"><a class="btn join" target="_top">加入會員</a><a class="btn line shop" target="_top">去官網選購</a></div>
      </div>

      <button type="button" class="btn line js-start">再玩一次</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  /* ===== 可調整的設定 ===== */
  var DURATION=60;                 /* 一局秒數 */
  var PTS_OK=100, PTS_NG=-50;      /* 送對／送錯 */
  var COOLDOWN=0.28;               /* 兩次丟禮物最短間隔（秒） */
  var WARMUP=4;                    /* 開場前幾間房子都要綠禮物，讓人先熟悉 */
  /* 結算稱號：分數門檻由低到高 */
  var RANKS=[
    [0,   '見習小精靈', '禮物有點迷路，再練習一下就上手了！'],
    [1500,'送禮小幫手', '大家都收到禮物了，聖誕快樂！'],
    [4000,'金牌麋鹿',   '又快又準，整條街都在謝謝你！'],
    [7000,'聖誕貓老公公','傳說中的送禮高手，就是你！']
  ];
  var SHOP='https://www.niyan-cement.com/';
  var JOIN=SHOP+'users/sign_in';   /* 加入會員／登入 */
  var HOW='請先加入官網會員並登入，結帳時在「優惠代碼」欄位輸入就能享 95 折。';

  var $=function(s){ return document.querySelector(s); };
  var $$=function(s){ return [].slice.call(document.querySelectorAll(s)); };
  var store={
    get:function(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
    set:function(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
  };
  function clamp(v,a,b){ return v<a?a:v>b?b:v; }
  function lerp(a,b,t){ return a+(b-a)*t; }
  function rnd(a,b){ return a+Math.random()*(b-a); }
  var COL={g:'#4F7A5A', r:'#B3302E'};

  var cv=$('#cv'), ctx=cv.getContext('2d');
  var W=0, H=0, U=0, ground=0, padH=0, small=false;

  if(/[?&]tune/.test(location.search)){
    var tune=$('.tune'), tr=tune.querySelector('input');
    tune.hidden=false;
    tr.addEventListener('input',function(){ $('.paper').style.opacity=tr.value; tune.querySelector('b').textContent=Number(tr.value).toFixed(2); });
  }

  /* ===== 素材 ===== */
  var sledImg=new Image();   /* 雪橇貓（含帽子、圍巾），車頭朝右 */
  var loading=2;   /* 雪橇和房子都載好才能開始 */
  function loaded(){ if(--loading) return; var b=$('.ov-start .js-start'); b.disabled=false; b.textContent='開始'; drawIcons(); }
  sledImg.onload=loaded;
  sledImg.src='assets/sleigh.svg';

  /* 送對了禮物打開會跳出招財貓：招福、金運兩款 × 六色（和選色測驗同一組顏色），隨機 */
  var LUCKY_COLORS=[
    {o:'#9A7432',b:'#F3D88E',l:'#9A7432',e:'#F2B8B5'},   /* 招財黃 */
    {o:'#A8706B',b:'#F2C9C4',l:'#A8706B',e:'#E8A09A'},   /* 戀愛粉 */
    {o:'#66724A',b:'#BEC79F',l:'#66724A',e:'#F2B8B5'},   /* 健康綠 */
    {o:'#2B2724',b:'#3D3935',l:'#EFE6D6',e:'#F2B8B5'},   /* 炭錢黑 */
    {o:'#8C7B66',b:'#FAF6EE',l:'#8C7B66',e:'#F2B8B5'},   /* 純淨白 */
    {o:'#5E5E5A',b:'#BDBDB8',l:'#5E5E5A',e:'#F2B8B5'}    /* 清水灰 */
  ];
  /* 雪花圖：一張 25 片，切成小圖跟圓點雪一起飄 */
  var FLAKES=[[87,287,101,115],[223,288,73,83],[339,288,74,83],[588,288,72,83],[699,288,82,93],[814,288,100,113],[214,393,90,102],[337,394,80,91],[446,288,109,124],[585,395,79,90],[698,400,84,95],[88,443,97,115],[445,437,110,126],[815,442,97,116],[222,518,74,86],[337,508,79,89],[584,510,80,91],[713,524,74,81],[88,603,98,111],[220,624,79,89],[336,619,82,94],[448,597,104,117],[584,624,80,90],[698,619,84,94],[814,603,98,111]];
  var flakeImgs=[];
  var flakeSheet=new Image();
  flakeSheet.onload=function(){
    FLAKES.forEach(function(f){
      var k=40/Math.max(f[2],f[3]), fc=document.createElement('canvas');
      fc.width=Math.ceil(f[2]*k); fc.height=Math.ceil(f[3]*k);
      fc.getContext('2d').drawImage(flakeSheet,f[0],f[1],f[2],f[3],0,0,fc.width,fc.height);
      flakeImgs.push(fc);
    });
  };
  flakeSheet.src='assets/snowflakes.svg';
  /* 房子圖：一張四棟。座標都是圖裡的單位：s=在整張圖的範圍，p=屋頂尖（雪的上緣），e=右邊屋簷，
     win=每一格窗格（圖裡是透空的，後面墊色就會亮燈；用像素量出來的） */
  var HOUSE_TYPES=[{"s":[0,0,495,388],"p":[247,0],"e":[460,187],"win":[[125,246,23,27],[156,246,23,27],[314,246,23,27],[344,246,24,27],[156,280,23,27],[345,280,23,28],[125,281,24,26],[314,281,24,26]]},{"s":[877,18,495,523],"p":[242,2],"e":[454,192],"win":[[126,249,23,27],[156,249,24,27],[345,249,23,27],[315,250,23,26],[157,283,23,27],[345,283,24,27],[126,284,23,26],[314,284,24,26],[126,374,23,28],[345,374,23,27],[156,375,24,26],[315,375,23,26],[126,409,23,26],[157,409,23,27],[314,409,24,27],[345,409,24,27]]},{"s":[0,601,495,466],"p":[242,5],"e":[465,131],"win":[[226,100,26,26],[260,100,25,26],[226,135,26,25],[260,135,25,25],[131,212,23,24],[162,212,22,24],[329,212,22,24],[359,212,22,24],[131,244,23,24],[162,244,22,23],[329,244,22,24],[359,244,22,23],[131,341,23,23],[162,341,22,23],[329,341,22,23],[359,341,22,23],[162,372,22,24],[329,372,22,24],[131,373,23,23],[359,373,22,23]]},{"s":[798,710,495,350],"p":[232,0],"e":[444,167],"win":[[218,116,24,27],[251,116,24,27],[217,151,25,24],[251,151,25,24],[123,214,23,22],[153,214,23,22],[317,214,23,22],[347,214,23,22],[123,244,23,23],[153,244,23,23],[317,244,23,23],[347,244,23,23]]}];
  var houseImgs=[];
  var houseSheet=new Image();
  houseSheet.onload=function(){
    HOUSE_TYPES.forEach(function(t){
      var k=1.6, hc=document.createElement('canvas');   /* 先畫成點陣，遊戲中每格不用重畫 SVG */
      hc.width=Math.ceil(t.s[2]*k); hc.height=Math.ceil(t.s[3]*k);
      hc.getContext('2d').drawImage(houseSheet,t.s[0],t.s[1],t.s[2],t.s[3],0,0,hc.width,hc.height);
      houseImgs.push(hc);
    });
    loaded();
  };
  houseSheet.src='assets/houses.svg';
  /* 星星月亮圖：0=滿月，其餘是星星（四角星×4、五角星、小星×2），切成小圖 */
  var SKY_SRC=[[270,114,159,159],[473.5,279.2,19.7,21.4],[152.9,270.8,20.9,22.7],[235.3,327,20.9,22.7],[552.2,251.4,29.6,32.3],[47.2,100.2,17.7,16.4],[244.6,60.1,6.5,7],[164,108.9,6.5,7]];
  /* 固定在天空的星星：[x 佔寬比例, y 佔天空高度比例, 圖, 大小(U), 閃爍相位] */
  var STARS=[[0.06,0.30,4,0.5,0.0],[0.15,0.62,1,0.32,1.7],[0.24,0.18,6,0.16,3.1],[0.33,0.48,5,0.3,0.6],[0.40,0.12,2,0.38,2.4],
    [0.47,0.70,7,0.16,4.0],[0.53,0.36,3,0.42,1.1],[0.60,0.14,6,0.15,5.2],[0.66,0.58,4,0.46,2.9],[0.72,0.30,7,0.14,0.3],
    [0.93,0.46,1,0.36,3.7],[0.88,0.70,5,0.26,4.6],[0.97,0.16,2,0.3,1.4],[0.10,0.80,3,0.3,5.8]];
  var skyImgs=[];
  var skySheet=new Image();
  skySheet.onload=function(){
    SKY_SRC.forEach(function(r,i){
      var k=(i?60:240)/Math.max(r[2],r[3]), sc=document.createElement('canvas');
      sc.width=Math.ceil(r[2]*k); sc.height=Math.ceil(r[3]*k);
      sc.getContext('2d').drawImage(skySheet,r[0],r[1],r[2],r[3],0,0,sc.width,sc.height);
      skyImgs.push(sc);
    });
  };
  skySheet.src='assets/starmoon.svg';
  var clock=0;
  var luckyImgs=[];
  ['fu','jin'].forEach(function(k){
    fetch('assets/lucky-'+k+'.svg').then(function(r){ return r.text(); }).then(function(svg){
      LUCKY_COLORS.forEach(function(c){
        var img=new Image();
        img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg.replace(/<style>[\s\S]*?<\/style>/,
          '<style>.o{fill:'+c.o+'}.b{fill:'+c.b+'}.l{fill:'+c.l+'}.e{fill:'+c.e+'}</style>'));
        luckyImgs.push(img);
      });
    }).catch(function(){});   /* 載不到就維持顯示「謝謝」 */
  });

  /* ===== 狀態 ===== */
  var sleigh={x:0, y:0, t:0};
  var houses=[], gifts=[], parts=[], texts=[], snow=[];
  var state='menu', score=0, elapsed=0, combo=0, maxCombo=0, ok=0, ng=0, cool=0, countdown=0, worldX=0, built=0;
  var best=store.get('niyan_xmas_best')||0;

  function resize(){
    var dpr=Math.min(window.devicePixelRatio||1,2);
    W=cv.clientWidth; H=cv.clientHeight;
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    var oldU=U;
    U=Math.min(W/9,H/(W>H*1.2?11:13));   /* 寬畫面時物件放大一點，不會顯得太小 */
    if(oldU&&oldU!==U){ var f=U/oldU; houses.forEach(function(h){ h.x*=f; h.w*=f; h.s*=f; }); gifts.forEach(function(gf){ gf.x*=f; gf.y*=f; gf.vy*=f; }); }   /* 視窗大小變了，已經出現的房子跟著縮放 */
    small=W<500;   /* 手機或窄的外嵌框：煙囪判定放寬、開場慢一點 */
    padH=$('.pad').offsetHeight;
    ground=H-padH-U*0.5;
    sleigh.x=W*0.3;
    snow=[];
    for(var i=0;i<Math.round(W*H/9000);i++){
      var fl=i%4===0;   /* 四分之一是小雪花，其餘是圓點 */
      snow.push({x:Math.random()*W, y:Math.random()*H, r:fl?rnd(4,6.5):rnd(0.8,2.2), v:fl?rnd(14,26):rnd(15,40),
        f:fl?Math.floor(Math.random()*FLAKES.length):-1, a:Math.random()*6, va:rnd(-1,1)});
    }
  }
  window.addEventListener('resize',resize);
  resize();

  /* ===== 房子 ===== */
  function addHouse(x){
    var k=Math.floor(Math.random()*HOUSE_TYPES.length), t=HOUSE_TYPES[k];
    var room=ground-(Math.max(U*2.9,H*0.2)+U*1.1)-U;   /* 雪橇底部到地面還剩多少高度（留給煙囪和泡泡） */
    var s=Math.min(U*rnd(3.6,4.2)/t.s[2], Math.min(U*3.9,room)/t.s[3]);   /* 太高的房子縮小一點，才不會撞到雪橇 */
    var h={x:x, w:t.s[2]*s, s:s, k:k, want:built++<WARMUP?'g':Math.random()<0.5?'g':'r', done:null, t:Math.random()*6,
      clx:t.p[0]+(t.e[0]-t.p[0])*rnd(0.42,0.62)};   /* 煙囪在右半邊屋頂上 */
    houses.push(h);
    return h;
  }
  function houseTop(h){ return ground+U*0.12-HOUSE_TYPES[h.k].s[3]*h.s; }   /* 圖底的土堆稍微埋進雪地 */
  function roofLocal(t,lx){ return t.p[1]+Math.abs(lx-t.p[0])*(t.e[1]-t.p[1])/(t.e[0]-t.p[0]); }
  function geo(h){
    var t=HOUSE_TYPES[h.k], top0=houseTop(h);
    var cx=h.x+h.clx*h.s, cw=U*0.62;
    return {y0:top0, cx:cx, cw:cw, top:top0+roofLocal(t,h.clx)*h.s-U*0.75};
  }
  function roofY(h,x){ return houseTop(h)+roofLocal(HOUSE_TYPES[h.k],(x-h.x)/h.s)*h.s; }
  function fillHouses(){
    var last=houses[houses.length-1];
    var right=last?last.x+last.w:W*0.75;
    while(right<W+U*4){ var h=addHouse(right+U*rnd(0.5,1.8)); right=h.x+h.w; }
  }

  /* ===== 畫圖 ===== */
  function drawGift(c,x,y,s,color,rot,ribbon){
    ribbon=ribbon||'#F3E4BF';
    c.save(); c.translate(x,y); c.rotate(rot||0);
    c.fillStyle=color; c.fillRect(-s/2,-s/2+s*0.08,s,s*0.92);
    c.fillStyle='rgba(0,0,0,.12)'; c.fillRect(-s/2,-s/2+s*0.08,s,s*0.2);
    c.fillStyle=ribbon; c.fillRect(-s*0.09,-s/2+s*0.08,s*0.18,s*0.92); c.fillRect(-s/2,-s*0.02,s,s*0.16);
    c.strokeStyle=ribbon; c.lineWidth=s*0.1; c.lineCap='round';
    c.beginPath(); c.ellipse(-s*0.17,-s*0.5,s*0.16,s*0.1,-0.5,0,Math.PI*2); c.stroke();
    c.beginPath(); c.ellipse(s*0.17,-s*0.5,s*0.16,s*0.1,0.5,0,Math.PI*2); c.stroke();
    c.restore();
  }
  function drawSleigh(c,x,y,cw,t){
    /* 原點在雪橇中心，滑板底部約在 y+cw*0.53（禮物從這附近掉下去） */
    var w=cw*1.9, h=w*534.48/886.1;
    c.save(); c.translate(x,y); c.rotate(Math.sin(t*2)*0.03);
    if(sledImg.complete) c.drawImage(sledImg,-w*0.48,cw*0.53-h,w,h);
    c.restore();
  }
  function drawBubble(c,x,y,r,want,t){
    c.save(); c.translate(x,y+Math.sin(t*3)*r*0.12);
    c.fillStyle='#FFFDF8';
    c.beginPath(); c.arc(0,0,r,0,Math.PI*2); c.fill();
    c.beginPath(); c.moveTo(-r*0.25,r*0.85); c.lineTo(0,r*1.35); c.lineTo(r*0.25,r*0.85); c.fill();
    c.lineWidth=r*0.12; c.strokeStyle=COL[want]; c.beginPath(); c.arc(0,0,r,0,Math.PI*2); c.stroke();
    drawGift(c,0,r*0.06,r*1.05,COL[want],0);
    c.restore();
  }
  function drawHouse(c,h){
    var g=geo(h);
    var t=HOUSE_TYPES[h.k], img=houseImgs[h.k];
    /* 煙囪畫在房子後面：底邊順著屋頂斜度，只埋進積雪那一條，不會從屋頂木板縫透出來 */
    var x1=g.cx-g.cw/2, x2=g.cx+g.cw/2, band=26*h.s;
    c.fillStyle='#B57D46'; c.strokeStyle='#34414B'; c.lineWidth=Math.max(1.5,U*0.05); c.lineJoin='round';
    c.beginPath(); c.moveTo(x1,g.top); c.lineTo(x2,g.top); c.lineTo(x2,roofY(h,x2)+band); c.lineTo(x1,roofY(h,x1)+band); c.closePath(); c.fill(); c.stroke();
    c.fillStyle='#963F2E'; c.fillRect(x1+g.cw*0.62,g.top,g.cw*0.2,roofY(h,x2)-g.top);
    c.fillStyle='#826237'; c.fillRect(x1-U*0.06,g.top,g.cw+U*0.12,U*0.16); c.strokeRect(x1-U*0.06,g.top,g.cw+U*0.12,U*0.16);
    c.fillStyle='#FFFDF8'; c.fillRect(x1-U*0.06,g.top-U*0.07,g.cw+U*0.12,U*0.09);
    /* 窗戶：送對了會亮燈（墊在房子圖後面，從窗格透出來） */
    var lit=h.done==='ok';
    c.fillStyle=lit?'#F6D57A':'#3A4752';
    t.win.forEach(function(r){ c.fillRect(h.x+(r[0]-1)*h.s,g.y0+(r[1]-1)*h.s,(r[2]+2)*h.s,(r[3]+2)*h.s); });
    if(img) c.drawImage(img,h.x,g.y0,h.w,t.s[3]*h.s);
    /* 煙囪上方的需求泡泡 */
    if(!h.done) drawBubble(c,g.cx,g.top-U*0.85,U*0.42,h.want,h.t);
    else if(h.cat) drawLucky(c,h,g);
    else{
      c.font='700 '+Math.round(U*0.5)+'px "PingFang TC","Microsoft JhengHei",sans-serif';
      c.textAlign='center'; c.textBaseline='middle';
      c.fillStyle=h.done==='ok'?'#F6D57A':'#E0A39E';
      c.fillText(h.done==='ok'?'謝謝':'不對',g.cx,g.top-U*0.7);
    }
  }
  function drawLucky(c,h,g){
    /* 禮物蓋子彈開，招財貓從煙囪裡蹦出來，之後坐在煙囪上輕輕晃 */
    var t=h.cat.t, img=h.cat.img, ch=U*1.0, cw=ch*418/462;
    var k=clamp(t/0.45,0,1), rise=1-Math.pow(1-k,3);
    var sc=k<1?0.4+0.6*rise+Math.sin(k*Math.PI)*0.18:1;
    var rimY=g.top-U*0.07;
    c.save();
    c.beginPath(); c.rect(g.cx-U*3,rimY-U*4,U*6,U*4); c.clip();   /* 煙囪口以下藏起來 */
    c.translate(g.cx,rimY+ch*(1-rise)+U*0.05);
    c.rotate(k<1?0:Math.sin(h.t*3)*0.06);
    c.scale(sc,sc);
    c.drawImage(img,-cw/2,-ch,cw,ch);
    c.restore();
    c.fillStyle='#FFFDF8'; c.fillRect(g.cx-g.cw/2-U*0.06,rimY,g.cw+U*0.12,U*0.09);   /* 煙囪口積雪蓋在貓前面 */
    if(t<0.7){   /* 飛走的禮物蓋 */
      var a=1-t/0.7, s=U*0.55;
      c.save(); c.globalAlpha=a;
      c.translate(g.cx+h.cat.dir*U*1.6*t,rimY-U*2.2*t+U*2*t*t); c.rotate(h.cat.dir*t*5);
      c.fillStyle=COL[h.want]; c.fillRect(-s*0.58,-s*0.12,s*1.16,s*0.24);
      c.fillStyle='#F3E4BF'; c.fillRect(-s*0.09,-s*0.12,s*0.18,s*0.24);
      c.restore();
    }
  }
  function drawIcons(){
    $$('canvas[data-icon]').forEach(function(el){
      var c=el.getContext('2d'), k=el.dataset.icon, w=el.width, h=el.height;
      c.clearRect(0,0,w,h);
      if(k==='g'||k==='r'){
        if(el.closest('.pad')) drawGift(c,w/2,h*0.55,w*0.6,'#FFFDF8',0,COL[k]);   /* 按鈕上：白盒子配色緞帶 */
        else drawGift(c,w/2,h*0.55,w*0.6,COL[k],0);
      }
      if(k==='bubble') drawBubble(c,w/2,h*0.42,w*0.3,'r',0);
      if(k==='sleigh') drawSleigh(c,w*0.45,h*0.62,w*0.42,0);
    });
  }

  /* ===== 遊戲流程 ===== */
  /* 前 20 秒等速，之後慢慢加快，最快是開場的 1.4 倍 */
  function speed(){ return U*(small?2.8:3.2)*(1+0.4*clamp((elapsed/DURATION-0.33)/0.67,0,1)); }
  function buzz(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }   /* iPhone 不支援，會直接略過 */

  function start(){
    audio();
    score=0; elapsed=0; combo=0; maxCombo=0; ok=0; ng=0; cool=0;
    houses=[]; gifts=[]; parts=[]; texts=[]; built=0;
    fillHouses();
    state='count'; countdown=2.1;
    $$('.ov').forEach(function(o){ o.classList.remove('on'); });
    hud();
  }

  function drop(color){
    if(state!=='play'||cool>0) return;
    cool=COOLDOWN;
    gifts.push({c:color, x:sleigh.x, y:sleigh.y+U*0.5, vy:U*2, rot:0, vr:rnd(-4,4)});
    var b=$('.pad .'+color); b.classList.add('hit'); setTimeout(function(){ b.classList.remove('hit'); },90);
    sfx('drop');
  }

  function deliver(h,gift){
    var g=geo(h);
    if(gift.c===h.want){
      h.done='ok'; ok++; combo++; maxCombo=Math.max(maxCombo,combo);
      var mult=combo>=10?3:combo>=5?2:1, pts=PTS_OK*mult;
      score+=pts;
      burst(g.cx,g.top,['#F6D57A','#FFFDF8',COL[gift.c]],14);
      pop(g.cx,g.top-U*1.4,'+'+pts,'#F6D57A');
      if(luckyImgs.length) h.cat={img:luckyImgs[Math.floor(Math.random()*luckyImgs.length)], t:0, dir:Math.random()<0.5?-1:1};
      sfx('ok'); buzz(18);
    }else{
      h.done='ng'; ng++; combo=0;
      score=Math.max(0,score+PTS_NG);
      burst(g.cx,g.top,['#757575','#4A3F35'],10);
      pop(g.cx,g.top-U*1.4,'送錯了 '+PTS_NG,'#F2B8B0');
      sfx('ng'); buzz([50,40,50]);
    }
  }
  function miss(gift,y){
    combo=0;
    burst(gift.x,y,['#FFFDF8','#D9D3CA'],8);
    sfx('miss');
  }

  function end(){
    if(state==='over') return;
    state='over';
    var first=score>best;
    if(first){ best=score; store.set('niyan_xmas_best',best); }
    var rk=RANKS[0]; RANKS.forEach(function(x){ if(score>=x[0]) rk=x; });
    $('.e-score').textContent=score;
    $('.e-rank').textContent=rk[1];
    $('.e-msg').textContent=rk[2];
    $('.e-ok').textContent=ok; $('.e-ng').textContent=ng; $('.e-combo').textContent=maxCombo;
    endRec(first&&score>0);
    renderClaim();
    sfx('end');
    try{ window.parent.postMessage({type:'niyan-xmas:end', score:score},'*'); }catch(e){}
    setTimeout(function(){ $('.ov-end').classList.add('on'); },700);
  }

  function burst(x,y,cols,n){
    for(var i=0;i<n;i++){
      var a=Math.random()*Math.PI*2, v=U*rnd(1,3);
      parts.push({x:x, y:y, vx:Math.cos(a)*v, vy:Math.sin(a)*v-U*2, life:rnd(0.5,0.9), c:cols[i%cols.length], s:U*rnd(0.05,0.1)});
    }
  }
  function pop(x,y,txt,col){ texts.push({x:x, y:y, txt:txt, c:col, life:1}); }

  function update(dt){
    clock+=dt;
    sleigh.t+=dt;
    sleigh.y=Math.max(U*2.9,H*0.2)+Math.sin(sleigh.t*2)*U*0.15;
    snow.forEach(function(s){ s.y+=s.v*dt; s.x-=(state==='play'?speed()*0.15:6)*dt; s.a+=s.va*dt; if(s.y>H+8){ s.y=-8; s.x=Math.random()*W; } if(s.x<0) s.x+=W; });
    parts.forEach(function(p){ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=U*8*dt; });
    parts=parts.filter(function(p){ return p.life>0; });
    texts.forEach(function(t){ t.life-=dt; t.y-=U*0.8*dt; });
    texts=texts.filter(function(t){ return t.life>0; });
    houses.forEach(function(h){ h.t+=dt; if(h.cat) h.cat.t+=dt; });

    if(state==='count'){
      var n=Math.ceil(countdown/0.7);
      countdown-=dt;
      if(Math.ceil(countdown/0.7)!==n) sfx(countdown>0?'tick':'go');
      if(countdown<=0) state='play';
      return;
    }
    if(state!=='play') return;

    elapsed+=dt; cool=Math.max(0,cool-dt);
    var v=speed();
    worldX+=v*dt;
    houses.forEach(function(h){ h.x-=v*dt; });
    houses=houses.filter(function(h){ return h.x+h.w>-U*2; });
    fillHouses();

    for(var i=gifts.length-1;i>=0;i--){
      var gf=gifts[i];
      gf.vy+=U*26*dt; gf.y+=gf.vy*dt; gf.rot+=gf.vr*dt;
      var bottom=gf.y+U*0.27, gone=false;
      for(var j=0;j<houses.length&&!gone;j++){
        var h=houses[j], g=geo(h);
        if(!h.done && bottom>=g.top && gf.y<=g.top+U*0.4 && Math.abs(gf.x-g.cx)<=g.cw/2+U*(small?0.3:0.2)){ deliver(h,gf); gone=true; }
        else if(gf.x>=h.x-U*0.1 && gf.x<=h.x+h.w+U*0.1 && bottom>=roofY(h,gf.x)){ miss(gf,bottom); gone=true; }
      }
      if(!gone && bottom>=ground){ miss(gf,ground); gone=true; }
      if(gone) gifts.splice(i,1);
    }
    if(elapsed>=DURATION) end();
    hud();
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#2B3640'); g.addColorStop(1,'#4A5A63');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    if(skyImgs.length){
      /* 星星：位置固定，各自一閃一閃 */
      var skyH=ground*0.62;
      STARS.forEach(function(st){
        var im=skyImgs[st[2]], tw=0.5+0.5*Math.sin(clock*(1.6+st[4]*0.15)+st[4]);
        var sz=U*st[3]*(0.8+0.3*tw), k=sz/Math.max(im.width,im.height);
        ctx.globalAlpha=0.35+0.65*tw;
        ctx.drawImage(im,W*st[0]-im.width*k/2,skyH*st[1]-im.height*k/2,im.width*k,im.height*k);
      });
      ctx.globalAlpha=1;
      /* 滿月 + 一呼一吸的光暈 */
      var mx=W*0.82, my=Math.max(H*0.16,U*1.6), mr=U*0.75, glow=mr*(1.9+0.15*Math.sin(clock*1.2));
      var mg=ctx.createRadialGradient(mx,my,mr*0.9,mx,my,glow);
      mg.addColorStop(0,'rgba(248,233,201,.28)'); mg.addColorStop(1,'rgba(248,233,201,0)');
      ctx.fillStyle=mg; ctx.beginPath(); ctx.arc(mx,my,glow,0,Math.PI*2); ctx.fill();
      ctx.drawImage(skyImgs[0],mx-mr,my-mr,mr*2,mr*2);
    }
    /* 遠山 */
    ctx.fillStyle='#3E4C56';
    ctx.beginPath(); ctx.moveTo(0,ground);
    for(var x=0;x<=W+20;x+=20) ctx.lineTo(x,ground-U*1.2-Math.sin((x+worldX*0.2)/(U*2.2))*U*0.5);
    ctx.lineTo(W,ground); ctx.fill();
    /* 雪花 */
    ctx.fillStyle='rgba(255,255,255,.75)';
    snow.forEach(function(s){
      var fi=s.f>=0&&flakeImgs[s.f];
      if(fi){ var k=s.r*2/Math.max(fi.width,fi.height); ctx.save(); ctx.translate(s.x,s.y); ctx.rotate(s.a); ctx.drawImage(fi,-fi.width*k/2,-fi.height*k/2,fi.width*k,fi.height*k); ctx.restore(); }
      else{ ctx.beginPath(); ctx.arc(s.x,s.y,Math.min(s.r,2.2),0,Math.PI*2); ctx.fill(); }
    });

    houses.forEach(function(h){ drawHouse(ctx,h); });
    /* 地上積雪 */
    ctx.fillStyle='#F3F0EA'; ctx.fillRect(0,ground,W,H-ground);

    /* 下一個要送的位置提示：雪橇正下方的虛線 */
    if(state==='play'){
      ctx.strokeStyle='rgba(255,253,248,.18)'; ctx.setLineDash([4,8]); ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(sleigh.x,sleigh.y+U*0.9); ctx.lineTo(sleigh.x,ground); ctx.stroke(); ctx.setLineDash([]);
    }
    gifts.forEach(function(gf){ drawGift(ctx,gf.x,gf.y,U*0.55,COL[gf.c],gf.rot); });
    drawSleigh(ctx,sleigh.x,sleigh.y,U*2.1,sleigh.t);

    parts.forEach(function(p){ ctx.globalAlpha=Math.min(1,p.life*2); ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,p.s,0,Math.PI*2); ctx.fill(); });
    ctx.globalAlpha=1;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    texts.forEach(function(t){
      ctx.globalAlpha=Math.min(1,t.life*2);
      ctx.font='700 '+Math.round(U*0.45)+'px "PingFang TC","Microsoft JhengHei",sans-serif';
      ctx.lineWidth=4; ctx.strokeStyle='rgba(43,54,64,.8)'; ctx.strokeText(t.txt,t.x,t.y);
      ctx.fillStyle=t.c; ctx.fillText(t.txt,t.x,t.y);
    });
    ctx.globalAlpha=1;

    if(state==='count'){
      var n=Math.ceil(countdown/0.7), f=countdown/0.7-Math.floor(countdown/0.7);
      ctx.font='700 '+Math.round(U*(1.6+f*0.6))+'px "PingFang TC","Microsoft JhengHei",sans-serif';
      ctx.lineWidth=6; ctx.strokeStyle='rgba(43,54,64,.8)'; ctx.strokeText(n,W/2,H*0.45);
      ctx.fillStyle='#FFFDF8'; ctx.fillText(n,W/2,H*0.45);
    }
  }

  var hScore=$('.h-score'), hTime=$('.h-time'), hDone=$('.h-done'), hCombo=$('.combo');
  function hud(){
    hScore.textContent=score;
    hTime.textContent=Math.ceil(Math.max(0,DURATION-elapsed))+' 秒';
    hDone.textContent='送達 '+ok;
    var mult=combo>=10?3:combo>=5?2:1;
    hCombo.classList.toggle('on',combo>=3&&state==='play');
    if(combo>=3) hCombo.textContent=combo+' 連擊'+(mult>1?'　分數 x'+mult:'');
  }

  var last=0;
  function loop(now){
    var dt=Math.min(0.05,(now-last)/1000||0); last=now;
    update(dt); draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* ===== 操作：左鍵綠、右鍵紅；手機用下方按鈕 ===== */
  /* 整頁鎖右鍵、長按選單、拖曳圖片；只有 email 欄位保留，方便貼上 */
  document.addEventListener('contextmenu',function(e){ if(e.target.tagName!=='INPUT') e.preventDefault(); });
  document.addEventListener('dragstart',function(e){ e.preventDefault(); });
  document.addEventListener('selectstart',function(e){ if(e.target.tagName!=='INPUT') e.preventDefault(); });
  cv.addEventListener('pointerdown',function(e){
    if(e.pointerType==='mouse') drop(e.button===2?'r':'g');
    else drop(e.clientX<W/2?'g':'r');
  });
  $$('.pad button').forEach(function(b){
    b.addEventListener('contextmenu',function(e){ e.preventDefault(); });
    b.addEventListener('pointerdown',function(e){ e.preventDefault(); drop(b.dataset.c); });
  });
  window.addEventListener('keydown',function(e){
    if(/INPUT|TEXTAREA/.test(e.target.tagName)) return;   /* 正在填 email 時不搶按鍵 */
    if(e.repeat) return;
    if(e.target.tagName==='BUTTON' && (e.key===' '||e.key==='Enter')) return;   /* 讓按鈕自己處理 */
    if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'||e.key==='z'||e.key==='Z'){ e.preventDefault(); drop('g'); }
    if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'||e.key==='x'||e.key==='X'){ e.preventDefault(); drop('r'); }
    if((e.key===' '||e.key==='Enter') && (state==='menu'&&!loading || state==='over'&&$('.ov-end.on'))){ e.preventDefault(); start(); }
  });
  $$('.js-start').forEach(function(b){ b.onclick=start; });

  /* ===== 紀錄：你的最高紀錄（這台裝置）＋目前最高分（/api/scores）。完整排行榜在出貨幫手 ===== */
  var claimed=null;                                /* {code, email}；不記在瀏覽器：每次打開都要先留 Email（同一次再玩不用重填） */
  var myEmail=claimed&&claimed.email||'';
  var topBest=null;                                /* null = 還沒讀到 */

  function api(url,body){
    return fetch(url,body?{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)}:undefined)
      .then(function(r){ return r.json().then(function(d){ if(!r.ok||!d.ok) throw new Error(d.error||''); return d; }); });
  }
  function renderRec(isNew){
    var top=topBest==null?'—':topBest?topBest:'—';
    $$('.r-top').forEach(function(el){ el.textContent=top; });
    $$('.r-mine').forEach(function(el){ el.textContent=best||'—'; });
    var champ=best>0&&topBest!=null&&best>=topBest;
    $('.n-start').textContent=champ?'你就是目前最高分！':topBest===0?'還沒有人登錄分數，搶第一個！':'';
    var note='';
    if(isNew) note=champ?'刷新紀錄，也是目前最高分！':'刷新你的最高紀錄！';
    else if(champ) note='你就是目前最高分！';
    if(!myEmail&&best>0) note+=(note?' ':'')+'留下 Email 就能登錄分數';
    $('.n-end').textContent=note;
  }
  function loadTop(isNew){
    api('/api/scores?game=xmas').then(function(d){ topBest=d.best; }).catch(function(){})
      .then(function(){ renderRec(isNew); });
  }
  /* 結算：留過 email 就自動登錄最高分 */
  function endRec(isNew){
    renderRec(isNew);
    if(myEmail&&best>0){
      api('/api/scores',{game:'xmas', email:myEmail, score:best})
        .then(function(d){ topBest=d.best; renderRec(isNew); })
        .catch(function(){ loadTop(isNew); });
    }else loadTop(isNew);
  }
  loadTop(false);

  /* ===== 領券：email 存到 D1（/api/claim），回傳優惠碼，同時登錄分數 ===== */
  var SRC=(new URLSearchParams(location.search).get('src')||'').slice(0,60);
  var form=$('.c-form'), got=$('.c-got'), err=$('.c-form .err'), submit=$('.c-form .btn');
  $('.shop').href=SHOP;
  $$('.join').forEach(function(a){ a.href=JOIN; });
  $('.c-how').textContent=HOW;
  function renderClaim(again){
    var done=!!myEmail;
    form.hidden=done; got.hidden=!done;
    if(!done) return;
    $('.c-title').textContent=again?'這個 Email 已經領過囉，優惠碼在這裡':'你的 95 折優惠碼';
    $('.c-code').textContent=claimed.code;
    $('.copy').textContent='複製';
  }
  form.addEventListener('submit',function(e){
    e.preventDefault();
    var email=form.email.value.trim().toLowerCase();
    err.textContent='';
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ err.textContent='請輸入正確的 Email'; form.email.focus(); return; }
    if(!form.consent.checked){ err.textContent='請勾選同意，才能寄送優惠給你'; return; }
    submit.disabled=true; submit.textContent='處理中…';
    api('/api/claim',{email:email, consent:true, game:'xmas', score:best, src:SRC, website:form.website.value})
      .then(function(d){
        claimed={code:d.code, email:email}; myEmail=email;
        renderClaim(!d.isNew);
        if(d.best!=null){ topBest=d.best; renderRec(false); }
      })
      .catch(function(x){ err.textContent=x.message||'網路好像不太穩，請再試一次'; })
      .then(function(){ submit.disabled=false; submit.textContent='登錄分數並領取優惠碼'; });
  });
  $('.copy').onclick=function(){
    var b=this, code=$('.c-code').textContent;
    function done(){ b.textContent='已複製'; }
    function fallback(){
      var t=document.createElement('textarea'); t.value=code; document.body.appendChild(t); t.select();
      try{ document.execCommand('copy'); done(); }catch(e){}
      document.body.removeChild(t);
    }
    if(navigator.clipboard) navigator.clipboard.writeText(code).then(done,fallback); else fallback();
  };

  /* ===== 音效（WebAudio 合成） ===== */
  var AC=null, muted=store.get('niyan_catch_mute')===true, muteBtn=$('.mute');
  function setMuteLabel(){ muteBtn.textContent=muted?'音效 關':'音效 開'; }
  setMuteLabel();
  muteBtn.onclick=function(){ muted=!muted; store.set('niyan_catch_mute',muted); setMuteLabel(); audio(); };
  function audio(){
    if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(AC&&AC.state==='suspended') AC.resume();
  }
  function tone(f,d,type,vol,to,delay){
    if(muted||!AC) return;
    var t=AC.currentTime+(delay||0), o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
    if(to) o.frequency.exponentialRampToValueAtTime(to,t+d);
    g.gain.setValueAtTime(vol||0.1,t); g.gain.exponentialRampToValueAtTime(0.001,t+d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+0.02);
  }
  function sfx(k){
    if(k==='drop'){ tone(520,0.12,'sine',0.06,260); }
    else if(k==='ok'){ [1568,2093,2637].forEach(function(f,i){ tone(f,0.25,'sine',0.08,0,i*0.07); }); }
    else if(k==='ng'){ tone(220,0.25,'square',0.06,150); }
    else if(k==='miss'){ tone(300,0.1,'triangle',0.05,200); }
    else if(k==='tick'){ tone(660,0.08,'sine',0.1); }
    else if(k==='go'){ tone(990,0.18,'sine',0.12); }
    else if(k==='end'){ [659,659,659,659,659,659,659,784,523,587,659].forEach(function(f,i){ var d=[0,.15,.3,.6,.75,.9,1.2,1.35,1.5,1.65,1.8][i]; tone(f,0.16,'triangle',0.08,0,d); }); }
  }
})();
</script>
</body>
</html>
